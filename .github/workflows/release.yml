name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        # Semver tag policy: vX.Y.Z always publishes :X.Y.Z. A release without
        # a prerelease suffix also moves :latest; a prerelease like
        # v1.2.3-rc.0 instead moves the channel tag :rc.
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          version="${GITHUB_REF_NAME#v}"
          tags="${image}:${version}"
          case "$version" in
            *-*)
              channel="${version#*-}"
              channel="${channel%%.*}"
              tags="${tags},${image}:${channel}"
              ;;
            *)
              tags="${tags},${image}:latest"
              ;;
          esac
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
